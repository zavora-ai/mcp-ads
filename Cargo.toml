[package]
name = "mcp-ads"
version = "1.0.0"
edition = "2024"
authors = ["James Karanja <james.karanja@zavora.ai>"]
description = "Ads MCP Server — a digital advertising platform (campaigns, ad groups, ads/creatives, budgets and bids, audiences, performance metrics with derived CTR/CPC/CPA/ROAS, pacing, and optimization suggestions) with a full audit trail and approval gates on spend-affecting changes"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/mcp-ads"
homepage = "https://enterprise.adk-rust.com"
keywords = ["mcp", "ads", "advertising", "marketing", "roas"]
categories = ["development-tools"]
readme = "README.md"

[dependencies]
adk-mcp-sdk = "0.1"
rmcp = { version = "1.7", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

[workspace]
